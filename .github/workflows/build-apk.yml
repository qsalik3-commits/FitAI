name: Build & Release Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          java -version
          echo "JAVA_HOME: $JAVA_HOME"
          JAVA_VERSION_OUTPUT=$(java -version 2>&1 | head -n 1)
          echo "Detected version string: $JAVA_VERSION_OUTPUT"
          
          # Extract major version number (e.g. "17.0.x" -> 17)
          MAJOR_VERSION=$(echo "$JAVA_VERSION_OUTPUT" | sed -E 's/.*version "([0-9]+).*/\1/')
          
          if [[ -z "$MAJOR_VERSION" || ! "$MAJOR_VERSION" =~ ^[0-9]+$ ]]; then
            echo "::error::Could not detect Java major version."
            exit 1
          fi
          
          echo "Active Java major version: $MAJOR_VERSION"
          
          if [ "$MAJOR_VERSION" -lt 17 ]; then
            echo "::error::Active Java major version ($MAJOR_VERSION) is lower than 17."
            exit 1
          fi

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug keystore
        run: |
          if [ -f "./debug.keystore" ]; then
            echo "debug.keystore already exists."
          else
            echo "debug.keystore not found. Generating temporary debug keystore..."
            keytool -genkeypair \
              -alias androiddebugkey \
              -keypass android \
              -keystore ./debug.keystore \
              -storepass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000
          fi
          
          if [ ! -f "./debug.keystore" ]; then
            echo "::error::Failed to create ./debug.keystore"
            exit 1
          fi
          echo "Temporary debug keystore verified."

      - name: Build debug APK
        run: |
          gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify APK
        run: |
          EXPECTED_APK="app/build/outputs/apk/debug/app-debug.apk"
          
          if [ ! -f "$EXPECTED_APK" ]; then
            echo "::error::Expected APK not found at $EXPECTED_APK"
            echo "Searching within app/build/outputs/apk:"
            if [ -d "app/build/outputs/apk" ]; then
              find app/build/outputs/apk -maxdepth 4 -name "*.apk"
            else
              echo "Directory app/build/outputs/apk does not exist."
            fi
            exit 1
          fi
          
          if [ ! -s "$EXPECTED_APK" ]; then
            echo "::error::APK file $EXPECTED_APK is empty."
            exit 1
          fi
          
          if [[ "$EXPECTED_APK" != *.apk ]]; then
            echo "::error::File $EXPECTED_APK does not have .apk extension."
            exit 1
          fi
          
          echo "Verified debug APK at: $EXPECTED_APK"
          ls -lh "$EXPECTED_APK"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_asset
        run: |
          RUNNER_TMP_DIR=$(mktemp -d -t apk-release-XXXXXX)
          REPO_RAW="${{ github.event.repository.name }}"
          if [ -z "$REPO_RAW" ]; then
            REPO_RAW="app"
          fi
          # Sanitize repo name (keep alphanumeric, dots, dashes)
          REPO_NAME=$(echo "$REPO_RAW" | tr -cd '[:alnum:]._-' | tr '[:upper:]' '[:lower:]')
          if [ -z "$REPO_NAME" ]; then
            REPO_NAME="app"
          fi
          
          APK_FILENAME="${REPO_NAME}-debug-build-${{ github.run_number }}.apk"
          TARGET_PATH="${RUNNER_TMP_DIR}/${APK_FILENAME}"
          
          cp "app/build/outputs/apk/debug/app-debug.apk" "$TARGET_PATH"
          
          if [ ! -s "$TARGET_PATH" ]; then
            echo "::error::Failed to prepare release asset at $TARGET_PATH"
            exit 1
          fi
          
          echo "Prepared release asset: $TARGET_PATH ($APK_FILENAME)"
          echo "asset_path=${TARGET_PATH}" >> "$GITHUB_OUTPUT"
          echo "asset_name=${APK_FILENAME}" >> "$GITHUB_OUTPUT"

      - name: Publish APK to GitHub Releases
        id: create_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh --version
          
          ASSET_PATH="${{ steps.prepare_asset.outputs.asset_path }}"
          ASSET_NAME="${{ steps.prepare_asset.outputs.asset_name }}"
          
          if [ ! -f "$ASSET_PATH" ] || [ ! -s "$ASSET_PATH" ]; then
            echo "::error::Release asset $ASSET_PATH is invalid or missing."
            exit 1
          fi
          
          RELEASE_TAG="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          RELEASE_TITLE="Debug APK Build #${{ github.run_number }}"
          TARGET_COMMIT="${{ github.sha }}"
          
          RELEASE_NOTES=$(cat <<EOF
          ### 📱 FitAI Debug APK Build #${{ github.run_number }}
          
          This is an automatically generated debug APK built by GitHub Actions.
          
          - **Workflow Run Number:** #${{ github.run_number }}
          - **Workflow Run Attempt:** #${{ github.run_attempt }}
          - **Source Commit SHA:** \`${TARGET_COMMIT}\`
          - **Asset Filename:** \`${ASSET_NAME}\`
          
          > ⚠️ **Testing Notice:** This APK is intended for testing purposes and is not a Play Store production release. The APK is signed with a temporary debug keystore.
          EOF
          )
          
          gh release create "$RELEASE_TAG" \
            "$ASSET_PATH" \
            --title "$RELEASE_TITLE" \
            --notes "$RELEASE_NOTES" \
            --target "$TARGET_COMMIT" \
            --latest

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE_TAG="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          RELEASE_STATUS="${{ steps.create_release.outcome }}"
          ASSET_NAME="${{ steps.prepare_asset.outputs.asset_name }}"
          
          if [ "$RELEASE_STATUS" = "success" ]; then
            echo "=================================================="
            echo "🎉 GitHub Release Published Successfully!"
            echo "=================================================="
            gh release view "$RELEASE_TAG"
            
            REPO_URL="${{ github.server_url }}/${{ github.repository }}"
            RELEASE_URL="${REPO_URL}/releases/tag/${RELEASE_TAG}"
            
            echo "Release Tag: $RELEASE_TAG"
            echo "Release Title: Debug APK Build #${{ github.run_number }}"
            echo "Release URL: $RELEASE_URL"
            echo "APK Asset Filename: $ASSET_NAME"
            
            echo "### 🚀 APK Release Published Successfully" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "- **Download APK from GitHub Release:** [Direct Release Page]($RELEASE_URL)" >> "$GITHUB_STEP_SUMMARY"
            echo "- **Asset Name:** \`$ASSET_NAME\`" >> "$GITHUB_STEP_SUMMARY"
            echo "- **Note:** Download the APK directly from the **Assets** section on your phone." >> "$GITHUB_STEP_SUMMARY"
            echo "- **Backup:** The Actions artifact \`app-debug-apk\` is also available on this workflow run." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "=================================================="
            echo "⚠️ Release publishing did not complete successfully."
            echo "=================================================="
            echo "The debug APK build and GitHub Actions artifact upload succeeded."
            echo "The artifact named 'app-debug-apk' remains available for download."
            
            echo "### ⚠️ Debug APK Built (Release Publishing Warning)" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "- The APK was successfully compiled and verified." >> "$GITHUB_STEP_SUMMARY"
            echo "- The debug APK is preserved and available as the **\`app-debug-apk\`** workflow artifact." >> "$GITHUB_STEP_SUMMARY"
            echo "- GitHub Release publishing did not complete (e.g. check repository permissions for GitHub Actions: \`Settings > Actions > General > Workflow permissions > Read and write permissions\`)." >> "$GITHUB_STEP_SUMMARY"
          fi
